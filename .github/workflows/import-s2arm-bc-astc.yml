


name: Import S2Arm BC ASTC port

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out project repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream S2Arm source
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/jhaizhou-ops/S2Arm.git \
            /tmp/S2Arm

      - name: Locate BC ASTC patch
        shell: bash
        run: |
          set -euo pipefail

          if [ -s "$GITHUB_WORKSPACE/s2arm-bc-astc-port-stage3.patch" ]; then
            echo "PATCH_FILE=$GITHUB_WORKSPACE/s2arm-bc-astc-port-stage3.patch" >> "$GITHUB_ENV"

          elif [ -s "$GITHUB_WORKSPACE/.github/workflows/s2arm-bc-astc-port-stage3.patch" ]; then
            echo "PATCH_FILE=$GITHUB_WORKSPACE/.github/workflows/s2arm-bc-astc-port-stage3.patch" >> "$GITHUB_ENV"

          else
            echo "::error::BC ASTC patch file not found"
            exit 1
          fi

      - name: Check and apply BC ASTC patch
        shell: bash
        run: |
          set -euo pipefail

          patch --dry-run --batch -p2 \
            -d /tmp/S2Arm \
            < "$PATCH_FILE"

          patch --batch -p2 \
            -d /tmp/S2Arm \
            < "$PATCH_FILE"

      - name: Build portable texture tests
        shell: bash
        run: |
          set -euo pipefail

          make -C /tmp/S2Arm/graphics/nvn/gfx/tex/tests \
            t_bc_soft t_tex t_tex_layout

      - name: Run portable texture tests
        shell: bash
        run: |
          set -euo pipefail

          /tmp/S2Arm/graphics/nvn/gfx/tex/tests/t_bc_soft

          /tmp/S2Arm/graphics/nvn/gfx/tex/tests/t_tex

          /tmp/S2Arm/graphics/nvn/gfx/tex/tests/t_tex_layout

      - name: Publish patched source
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows/' \
            /tmp/S2Arm/ "$GITHUB_WORKSPACE"/

          rm -f "$GITHUB_WORKSPACE/s2arm-bc-astc-port-stage3.patch"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/s2arm-bc-astc-port-stage3.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C bc-astc-import

          git add -A

          git commit -m "Import S2Arm with experimental BC ASTC port"

          git push --force origin HEAD:refs/heads/bc-astc-import
