name: S2Arm compatibility integrity

on:
  pull_request:
    paths:
      - 'compat/**'
      - 'tests/dev_run_test.sh'
      - 'tests/fake_*.py'
      - 'tools/dev_run.sh'
      - '.github/workflows/compat-integrity.yml'

permissions:
  contents: write

concurrency:
  group: compat-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Compatibility and focused dev_run checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout PR head and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bash 5
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install GNU timeout without overriding macOS tools
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions coreutils >/dev/null 2>&1 || brew install coreutils
          mkdir -p "$RUNNER_TEMP/s2a-timeout-bin"
          ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2a-timeout-bin/timeout"
          echo "$RUNNER_TEMP/s2a-timeout-bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Ryujinx base objects
        shell: bash
        run: bash compat/fetch_base.sh

      - name: Focused dev_run console-stream regression
        id: dev_con
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/compat-integrity
          DEV_RUN_GROUPS=con DEV_RUN_PAR=2 bash tests/dev_run_test.sh 2>&1 | tee build/compat-integrity/dev_run_con.log

      - name: Focused dev_run crash-smoke regression
        id: dev_smoke
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/compat-integrity
          DEV_RUN_GROUPS=smoke DEV_RUN_PAR=2 bash tests/dev_run_test.sh 2>&1 | tee build/compat-integrity/dev_run_smoke.log

      - name: Focused dev_run lag-heartbeat regression
        id: dev_lag
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/compat-integrity
          DEV_RUN_GROUPS=lag DEV_RUN_PAR=1 bash tests/dev_run_test.sh 2>&1 | tee build/compat-integrity/dev_run_lag.log

      - name: Reconcile or verify compatibility patch series
        id: reconcile
        shell: bash
        run: bash compat/preview_ldn_reconcile.sh

      - name: Update handoff with verified patch-series result
        if: steps.reconcile.outcome == 'success'
        shell: bash
        run: |
          cat >> docs/BC_ASTC_HANDOFF.md <<EOF

          ## 2026-11-25 — deterministic LDN patch-series reconciliation
          - Preview workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - The reconciliation script removes the four overlapping LDN route/auto patches from the active series, generates one incremental patch from the remaining series to compat/tree, and runs compat/verify.sh before any commit.
          - The preview artifact includes the generated patch, superseded patch copies, updated series, manifest, tree diff, and focused dev_run logs. The patch is committed only if console, smoke, lag-heartbeat, and compatibility verification steps all succeed.
          EOF

      - name: Commit verified compatibility patch reconciliation
        if: steps.dev_con.outcome == 'success' && steps.dev_smoke.outcome == 'success' && steps.dev_lag.outcome == 'success' && steps.reconcile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A compat/patches compat/改动清单.md docs/BC_ASTC_HANDOFF.md
          if git diff --cached --quiet; then
            echo "No verified compatibility patch changes to commit"
            exit 0
          fi
          git commit -m "fix(compat): consolidate overlapping LDN patch series"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-integrity-${{ github.run_id }}
          path: build/compat-integrity/**
          if-no-files-found: warn
          retention-days: 14
