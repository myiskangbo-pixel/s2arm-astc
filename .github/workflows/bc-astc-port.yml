
name: BC ASTC port validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'graphics/nvn/**'
      - '.github/workflows/bc-astc-port.yml'

permissions:
  contents: read

concurrency:
  group: bc-astc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build texture tests
        run: |
          make -C graphics/nvn/gfx/tex/tests \
            t_bc_soft t_tex t_tex_layout

      - name: Run BC transcode tests
        run: ./graphics/nvn/gfx/tex/tests/t_bc_soft

      - name: Run texture layout tests
        run: ./graphics/nvn/gfx/tex/tests/t_tex

      - name: Run texture shape tests
        run: ./graphics/nvn/gfx/tex/tests/t_tex_layout

  ios-metal-build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find metal

      - name: Run macOS texture tests
        run: make -C graphics/nvn/gfx/tex/tests run

      - name: Compile iOS Metal/NVN backend
        run: make -C graphics/nvn ios

      - name: Upload iOS NVN static library
        uses: actions/upload-artifact@v4
        with:
          name: s2arm-nvn-ios-bc-astc
          path: build/nvn/ios/libnvn.a
          if-no-files-found: error
          retention-days: 7

